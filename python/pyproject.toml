[project]
name = "ftptech-x402-canton"
version = "0.1.0"
description = "Canton x402 merchant plugin for the official x402 Python SDK (FastAPI, Flask)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "FTP Tech LLC" }]
keywords = ["x402", "canton", "payment", "http", "402", "fastapi", "flask"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # Tested against 2.28 only: the plugin uses SDK internals (see OPERATIONS.md). Widen after a CI run on the newer minor.
    "x402>=2.28,<2.29",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# The drivers are plain ASGI and WSGI: they need no extra, and install into an existing app of any
# recent FastAPI, Starlette or Flask. The extras only name the minimum the tests ran on.
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.2"]
redis = ["redis>=5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
    "mypy",
    "uvicorn[standard]>=0.30",
    "waitress>=3",
    "hypercorn>=0.17",
    "fastapi>=0.115",
    "flask>=3.1",
    "gunicorn>=22",
    "redis>=5",
    "fakeredis[lua]>=2.26",
]

[project.urls]
Homepage = "https://github.com/FTP-Tech-LLC/x402-canton-merchant"
Repository = "https://github.com/FTP-Tech-LLC/x402-canton-merchant"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftptech_x402_canton"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "OPERATIONS.md", "LICENSE", "NOTICE", "pyproject.toml"]

# The upstream x402 Python config (python/x402/pyproject.toml), unchanged.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by the formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["ftptech_x402_canton"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
